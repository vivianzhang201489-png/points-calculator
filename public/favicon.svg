<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">

  <!-- 粉色圆角背景 -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#ff1c77"/>

  <!-- 三条淡粉记录线（左对齐，短 → 中 → 长） -->
  <line x1="16" y1="40" x2="28" y2="40"
        stroke="#ffc1d6" stroke-width="3" stroke-linecap="round"/>

  <line x1="16" y1="46" x2="36" y2="46"
        stroke="#ffc1d6" stroke-width="3" stroke-linecap="round"/>

  <line x1="16" y1="52" x2="44" y2="52"
        stroke="#ffc1d6" stroke-width="3" stroke-linecap="round"/>

  <!-- 白色星星（在最上层） -->
  <polygon
    points="32,14 36,26 49,26 38,33 42,46 32,38 22,46 26,33 15,26 28,26"
    fill="white"
  />

</svg>
